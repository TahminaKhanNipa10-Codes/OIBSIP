<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator | Level 2</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="calculator-container">
      <div class="display-screen">
        <input type="text" id="screen" placeholder="0" disabled />
      </div>
      <div class="keypad">
        <!-- Scientific Row 1 -->
        <button class="btn sci" data-val="sin(">sin</button>
        <button class="btn sci" data-val="cos(">cos</button>
        <button class="btn sci" data-val="tan(">tan</button>
        <button class="btn sci" data-val="log(">log</button>

        <!-- Scientific Row 2 -->
        <button class="btn sci" data-val="√(">√</button>
        <button class="btn sci" data-val="^">x^y</button>
        <button class="btn sci" data-val="(">(</button>
        <button class="btn sci" data-val=")">)</button>

        <!-- Standard Row 1 -->
        <button class="btn clear" data-val="C">C</button>
        <button class="btn del" data-val="DEL">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button class="btn operator" data-val="%">%</button>
        <button class="btn operator" data-val="/">/</button>

        <!-- Standard Row 2 -->
        <button class="btn" data-val="7">7</button>
        <button class="btn" data-val="8">8</button>
        <button class="btn" data-val="9">9</button>
        <button class="btn operator" data-val="*">*</button>

        <!-- Standard Row 3 -->
        <button class="btn" data-val="4">4</button>
        <button class="btn" data-val="5">5</button>
        <button class="btn" data-val="6">6</button>
        <button class="btn operator" data-val="-">-</button>

        <!-- Standard Row 4 -->
        <button class="btn" data-val="1">1</button>
        <button class="btn" data-val="2">2</button>
        <button class="btn" data-val="3">3</button>
        <button class="btn operator" data-val="+">+</button>

        <!-- Standard Row 5 -->
        <button class="btn sci" data-val="π">π</button>
        <button class="btn" data-val="0">0</button>
        <button class="btn" data-val=".">.</button>
        <button class="btn equal" data-val="=">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
